# Refresh diario del índice del padrón. El import corre EN el servicio de
# Render (la descarga son ~26 MB y parsea en segundos); este cron sólo lo
# dispara. curl --retry por el cold start del plan free.
name: refresh
on:
  schedule:
    - cron: "30 11 * * *" # 05:30 CDMX
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar refresh en Render
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-connrefused --retry-all-errors \
            --max-time 600 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.MCP_API_KEY }}" \
            https://repse-mcp.onrender.com/refresh
